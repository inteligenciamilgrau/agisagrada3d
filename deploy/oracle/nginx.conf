# Proxy reverso do jogo — HTTPS (wss) -> Node (localhost:__PORT__)
# O __DOMAIN__ e __PORT__ são substituídos pelo setup.sh
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # O node serve o jogo estático E o WebSocket /ws — proxy de tudo
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket do servidor do jogo (upgrade obrigatório)
    location /ws {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
    }
}
