name: Deploy GitHub Pages

# O jogo é estático (HTML + CSS + módulos ES, Three.js via CDN), então não há
# etapa de build: o repositório inteiro é publicado como está.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para publicar no Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; corridas antigas são canceladas.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
